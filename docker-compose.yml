services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /work
    init: true
    volumes:
      - .:/work
      - playwright_node_modules:/work/node_modules

    ipc: host
    stdin_open: true
    tty: true
    command: sleep infinity

volumes:
  playwright_node_modules: